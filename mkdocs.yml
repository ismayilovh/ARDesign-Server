site_name: ARDesign Server
site_description: Documentation for the ARDesign FastAPI backend and deployment stack.
site_url: https://ismayilovh.github.io/ARDesign-Server/
repo_url: https://github.com/ismayilovh/ARDesign-Server
repo_name: ismayilovh/ARDesign-Server

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [server-source/fastapi_app]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            separate_signature: true
            docstring_section_style: table

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables

nav:
  - Home: index.md
  - Overview: backend.md
  - Architecture: architecture.md
  - Workflows: flows.md
  - Deployment: deployment.md
  - Maintenance: maintenance.md
  - API Reference:
      - Core: api/core.md
      - Data and models: api/models.md
      - Schemas: api/schemas.md
      - Routes: api/routes.md
      - Workers: api/workers.md

strict: true
