name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "docs-requirements.txt"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "docs-requirements.txt"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build HTML documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out documentation source
        uses: actions/checkout@v7
        with:
          lfs: false

      - name: Check out ARDesign Server API source
        uses: actions/checkout@v7
        with:
          ref: expert-panel-dev
          path: server-source
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation tools
        run: python -m pip install -r docs-requirements.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Verify generated site
        run: test -f site/index.html

      - name: Upload HTML documentation
        uses: actions/upload-artifact@v7
        with:
          name: ardesign-server-docs
          path: site
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy documentation to gh-pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: false

      - name: Download generated documentation
        uses: actions/download-artifact@v8
        with:
          name: ardesign-server-docs
          path: site

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin gh-pages
          publish_dir="${RUNNER_TEMP}/gh-pages"
          git worktree add --detach "${publish_dir}" FETCH_HEAD

          find "${publish_dir}" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "${GITHUB_WORKSPACE}/site/." "${publish_dir}/"
          touch "${publish_dir}/.nojekyll"

          cd "${publish_dir}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "Documentation is already up to date."
            exit 0
          fi

          git commit -m "docs(pages): deploy ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
